memory_limit = 2G
max_execution_time = 300
max_input_vars = 10000
upload_max_filesize = 64M
post_max_size = 64M
realpath_cache_size = 10M
date.timezone = ${SHOP_TZ}
display_errors = Off
log_errors = On
sendmail_path = "/opt/phpbox/bin/mailpit sendmail -S phpbox-mailpit:1025"
openssl.cafile = /cache/certs/ca-bundle.pem
curl.cainfo = /cache/certs/ca-bundle.pem
opcache.memory_consumption = 512
opcache.max_accelerated_files = 100000

map $ssl_server_name $cert_box {
    ~^(?:.+\.)?(?<cb>[a-z0-9][a-z0-9-]*)\.localhost$ $cb;
    default _;
}

server {
    listen 80 default_server;
    listen 443 ssl default_server;
    ssl_certificate /certs/$cert_box.pem;
    ssl_certificate_key /certs/$cert_box-key.pem;
    server_name ~^(?:.+\.)?(?<box>[a-z0-9][a-z0-9-]*)\.localhost$;
    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 1G;

    if ($box = "") {
        return 404 "phpbox: use https://<name>.localhost\n";
    }

    error_page 502 = @stopped;

    location / {
        proxy_pass http://phpbox-$box-web-1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_buffer_size 64k;
        proxy_buffers 16 32k;
    }

    location @stopped {
        default_type text/plain;
        return 502 "phpbox: box '$box' is not running (phpbox start $box)\n";
    }
}

server {
    listen 80;
    listen 443 ssl;
    server_name phpmyadmin.localhost;
    ssl_certificate /certs/phpmyadmin.pem;
    ssl_certificate_key /certs/phpmyadmin-key.pem;
    client_max_body_size 1G;

    location / {
        proxy_pass http://phpbox-phpmyadmin;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}

server {
    listen 80;
    listen 443 ssl;
    server_name mailpit.localhost;
    ssl_certificate /certs/mailpit.pem;
    ssl_certificate_key /certs/mailpit-key.pem;

    location / {
        proxy_pass http://phpbox-mailpit:8025;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
